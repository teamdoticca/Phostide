<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Phostide Settings screenshots</title>
    <style>
      body {
        margin: 0;
        background: #000;
        color: #f4f4f5;
        font: 14px/1.45 system-ui, sans-serif;
      }
      main {
        max-width: 780px;
        margin: 0 auto;
        padding: 32px 20px 64px;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
      }
      figure {
        margin: 28px 0 0;
        border: 1px solid #1c1c1f;
        border-radius: 12px;
        overflow: hidden;
        background: #0b0b0c;
      }
      img {
        display: block;
        width: 100%;
        height: auto;
      }
      figcaption {
        padding: 12px 16px;
        color: #8a8a93;
        border-top: 1px solid #1c1c1f;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Phostide Settings screenshots</h1>
      <p style="color: #8a8a93">
        Client crops used on README, install, OLED notes, and FAQ.
      </p>
      <figure>
        <img src="settings-taskbar.png" alt="Taskbar" />
        <figcaption>Taskbar</figcaption>
      </figure>
      <figure>
        <img src="settings-oled-care.png" alt="OLED Care" />
        <figcaption>OLED Care — pause while locked / in fullscreen</figcaption>
      </figure>
      <figure>
        <img src="settings-monitors.png" alt="Monitors" />
        <figcaption>Monitors — live painting status</figcaption>
      </figure>
      <figure>
        <img src="settings-system.png" alt="System" />
        <figcaption>System</figcaption>
      </figure>
    </main>
  </body>
</html>
