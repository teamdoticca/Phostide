<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phostide — logo concepts round 2</title>
  <style>
    body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: #f2f2f4; color: #111; }
    header { padding: 24px 32px 8px; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    p { margin: 0; color: #555; }
    nav { display: flex; gap: 12px; flex-wrap: wrap; padding: 12px 32px 24px; }
    nav a { color: #111; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 8px 12px; text-decoration: none; font-size: 14px; }
    .sheet { display: block; width: calc(100% - 64px); max-width: 1600px; margin: 0 32px 32px; background: #fff; border-radius: 12px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 0 32px 40px; }
    figure { margin: 0; background: #fff; border-radius: 12px; padding: 20px; text-align: center; }
    figure img { width: 100%; max-width: 280px; height: auto; }
    figcaption { margin-top: 12px; font-size: 14px; }
    strong { display: block; font-size: 16px; margin-bottom: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>Phostide — logo concepts round 2</h1>
    <p>Monitor / parallelogram + wavy bottom (motion). A recommended.</p>
  </header>
  <nav>
    <a href="concepts-r2.png">Concept sheet</a>
    <a href="preview.html">Older preview</a>
  </nav>
  <img class="sheet" src="concepts-r2.png" alt="Phostide round 2 concept sheet" />
  <div class="grid">
    <figure>
      <img src="renders/round2-a-screen-tide.png" alt="A Screen Tide" />
      <figcaption><strong>A — Screen Tide</strong>Monitor body, wavy bottom</figcaption>
    </figure>
    <figure>
      <img src="renders/round2-b-bezel-wave.png" alt="B Bezel Wave" />
      <figcaption><strong>B — Bezel Wave</strong>Hollow bezel, tide on both edges</figcaption>
    </figure>
    <figure>
      <img src="renders/round2-c-para-tide.png" alt="C Para Tide" />
      <figcaption><strong>C — Para Tide</strong>Skewed parallelogram + tide base</figcaption>
    </figure>
  </div>
</body>
</html>
